<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" fill="none">
  <defs>
    <!-- Wood Gradients for Xuồng Ba Lá Hull -->
    <linearGradient id="hullOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C6B46"/>
      <stop offset="35%" stop-color="#7B4E2E"/>
      <stop offset="70%" stop-color="#56341C"/>
      <stop offset="100%" stop-color="#361E0F"/>
    </linearGradient>

    <linearGradient id="hullInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E4426"/>
      <stop offset="60%" stop-color="#4C2B14"/>
      <stop offset="100%" stop-color="#301A0B"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#996E44" stop-opacity=".2"/>
      <stop offset="30%" stop-color="#5E8C76" stop-opacity=".6"/>
      <stop offset="50%" stop-color="#C99E63" stop-opacity=".7"/>
      <stop offset="70%" stop-color="#5E8C76" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#996E44" stop-opacity=".2"/>
    </linearGradient>

    <linearGradient id="coconutGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5CF63"/>
      <stop offset="60%" stop-color="#689C35"/>
      <stop offset="100%" stop-color="#3D631B"/>
    </linearGradient>
  </defs>

  <!-- Animated Floating Xuồng Ba Lá Group -->
  <g id="boat-group">
    <!-- Gentle floating up-down and slight tilt on the river -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -4.5; 0 0" dur="4.2s" repeatCount="indefinite"/>

    <!-- Dynamic River Ripples Under Xuồng -->
    <g stroke="url(#waterGrad)" stroke-width="2.5" stroke-linecap="round">
      <path d="M20,165 Q130,150 240,165 T460,165">
        <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
          values="M20,165 Q130,150 240,165 T460,165;
                  M20,165 Q130,175 240,165 T460,165;
                  M20,165 Q130,150 240,165 T460,165"/>
      </path>
      <ellipse cx="240" cy="168" rx="190" ry="12" fill="none" stroke="#DDB884" stroke-opacity=".3" stroke-width="1.5">
        <animate attributeName="rx" values="180;195;180" dur="3.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Hull Reflection in Water -->
    <ellipse cx="235" cy="162" rx="175" ry="15" fill="#3D2111" opacity=".22"/>

    <!-- ============================================== -->
    <!-- XUỒNG BA LÁ HULL (Thân Xuồng Ghép 3 Tấm Ván)   -->
    <!-- ============================================== -->
    <!-- Inner floor & inner side planks -->
    <path d="M25,122 C90,144 370,144 435,116 L415,142 C355,164 105,164 45,142 Z" fill="url(#hullInner)"/>

    <!-- Outer wooden hull (Ván be bên ngoài) -->
    <path d="M20,120 C100,168 360,168 440,114 C360,158 100,158 20,120 Z" fill="url(#hullOuter)"/>

    <!-- Top Gunwale / Rim (Be xuồng be viền nổi bật) -->
    <path d="M18,119 C98,167 362,167 442,113" stroke="#D9A56E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M18,121 C98,169 362,169 442,115" stroke="#683F20" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Prow & Stern Decks (Mũi xuồng vát nhọn & Sạp đuôi) -->
    <!-- Bow / Prow (Mũi xuồng ba lá vuốt thon dài) -->
    <polygon points="18,119 55,129 48,136 24,127" fill="#B38054" stroke="#633C1D" stroke-width="1"/>
    <!-- Stern / Lá trui đuôi xuồng -->
    <polygon points="442,113 405,123 412,130 436,120" fill="#9C6B42" stroke="#633C1D" stroke-width="1"/>

    <!-- Transverse Wooden Ribs (Cong xuồng ba lá truyền thống) -->
    <g stroke="#482713" stroke-width="3" stroke-linecap="round" opacity=".95">
      <line x1="85" y1="135" x2="94" y2="152"/>
      <line x1="135" y1="139" x2="144" y2="157"/>
      <line x1="185" y1="142" x2="194" y2="160"/>
      <line x1="235" y1="143" x2="244" y2="161"/>
      <line x1="285" y1="142" x2="294" y2="160"/>
      <line x1="335" y1="139" x2="344" y2="156"/>
      <line x1="385" y1="134" x2="393" y2="150"/>
    </g>

    <!-- Transverse Strut / Crossbeam (Thanh giằng be xuồng) -->
    <line x1="183" y1="146" x2="197" y2="146" stroke="#C49363" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="283" y1="146" x2="297" y2="146" stroke="#C49363" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ============================================== -->
    <!-- CARGO ON BOW (Dừa xiêm Bến Tre tươi xanh trên mũi) -->
    <!-- ============================================== -->
    <g transform="translate(80, 126)">
      <circle cx="0" cy="0" r="11" fill="url(#coconutGrad)"/>
      <circle cx="14" cy="-3" r="10" fill="url(#coconutGrad)"/>
      <circle cx="26" cy="1" r="9" fill="url(#coconutGrad)"/>
      <circle cx="7" cy="8" r="10.5" fill="#4C7826"/>
      <circle cx="-5" cy="5" r="9.5" fill="#38581B"/>
      <!-- Coconut stems / stalks -->
      <path d="M0,-8 L-4,-14 M14,-11 L12,-16" stroke="#2B4515" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Small woven bamboo basket on board (Giỏ cần xé đựng hoa quả) -->
    <g transform="translate(142, 134)">
      <ellipse cx="12" cy="6" rx="14" ry="7" fill="#8C6641" stroke="#563B20" stroke-width="1.5"/>
      <path d="M-2,6 Q12,18 26,6" stroke="#D1A772" stroke-width="1.5" fill="none"/>
      <!-- Yellow wild river blossoms in basket (Hoa điên điển vàng) -->
      <circle cx="8" cy="1" r="3" fill="#FDD835"/>
      <circle cx="15" cy="0" r="3.5" fill="#FBC02D"/>
      <circle cx="12" cy="4" r="2.8" fill="#FFF176"/>
    </g>

    <!-- ============================================== -->
    <!-- CHỦ XUỒNG BA LÁ (Người Chèo Đội Nón Lá, Áo Bà Ba) -->
    <!-- ============================================== -->
    <g transform="translate(325, 45)">
      <!-- Sitting body in Áo Bà Ba Nâu Đất -->
      <path d="M8,42 C-4,42 -12,54 -10,80 L24,80 C26,54 20,42 8,42 Z" fill="#6B4228"/>
      <line x1="8" y1="42" x2="8" y2="80" stroke="#482A15" stroke-width="2"/>
      <path d="M-4,80 L20,80 L22,96 L-6,96 Z" fill="#241E1C"/> <!-- Quần bà ba đen -->

      <!-- Nón Lá Bến Tre (Conical Palm Hat) -->
      <polygon points="8,0 -26,30 42,30" fill="#FCE9C0" stroke="#B0834B" stroke-width="1.8"/>
      <ellipse cx="8" cy="30" rx="34" ry="6" fill="#E8CD96" stroke="#875F30" stroke-width="1.2"/>
      <!-- Nón rings -->
      <path d="M-9,15 Q8,20 25,15" stroke="#D4A76A" stroke-width="1" fill="none"/>
      <!-- Chin Strap (Quai nón) -->
      <path d="M-12,30 Q8,42 26,30" stroke="#7E542F" stroke-width="1.2" fill="none"/>

      <!-- Arms holding paddle (Đôi tay cầm mái chèo vững chãi) -->
      <path d="M-5,50 L-22,66 L-18,72 L-1,56 Z" fill="#6B4228"/>
      <path d="M18,50 L-8,70 L-5,76 L22,56 Z" fill="#54331D"/>

      <!-- Long Wooden Paddle (Mái chèo gỗ cắm xuống dòng nước) -->
      <line x1="22" y1="36" x2="-45" y2="118" stroke="#996338" stroke-width="5" stroke-linecap="round"/>
      <line x1="22" y1="36" x2="-45" y2="118" stroke="#D19C6A" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Paddle blade (Lưỡi chèo dẹp) -->
      <path d="M-40,110 L-68,148 C-74,156 -66,162 -58,154 L-30,116 Z" fill="#B37A4B" stroke="#683F1E" stroke-width="1.5"/>

      <!-- Water swirl at paddle blade (Gợn nước xoáy mái dầm) -->
      <ellipse cx="-58" cy="148" rx="14" ry="4" fill="none" stroke="#FFE9B3" stroke-width="1.5" opacity=".75">
        <animate attributeName="rx" values="10;18;10" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;.3;.8" dur="2.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- ============================================== -->
    <!-- HOA LỤC BÌNH NỞ TÍM VEN XUỒNG (Water Hyacinth) -->
    <!-- ============================================== -->
    <g transform="translate(405, 160)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#386B3B" stroke="#1F4722" stroke-width="1"/>
      <ellipse cx="-12" cy="2" rx="11" ry="6" fill="#4B8550"/>
      <ellipse cx="12" cy="3" rx="11" ry="6" fill="#305E33"/>
      <!-- Violet flowers with yellow honey eye -->
      <g transform="translate(0, -9)">
        <ellipse cx="0" cy="-6" rx="5" ry="8" fill="#B388EB"/>
        <ellipse cx="-6" cy="-2" rx="7" ry="5" fill="#9B66D6"/>
        <ellipse cx="6" cy="-2" rx="7" ry="5" fill="#9B66D6"/>
        <ellipse cx="0" cy="2" rx="6" ry="6" fill="#8047BE"/>
        <ellipse cx="0" cy="-7" rx="2" ry="3" fill="#FFEE58"/>
        <circle cx="0" cy="-7" r="1" fill="#4A148C"/>
      </g>
    </g>
  </g>

  <!-- Ambient Light Reflection on Hull -->
  <g fill="#FFF9C4" opacity=".8">
    <circle cx="108" cy="122" r="2">
      <animate attributeName="opacity" values=".1;.9;.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="166" r="1.8">
      <animate attributeName="opacity" values=".8;.15;.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
