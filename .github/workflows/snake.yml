name: Generate Snake Animation

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Thien21112005
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0284c7&color_dots=#ebedf0,#99f6e4,#2dd4bf,#0d9488,#115e59
            dist/github-contribution-grid-snake-dark.svg?color_snake=#38b2ac&color_dots=#161b22,#0f766e,#0d9488,#14b8a6,#5eead4

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
